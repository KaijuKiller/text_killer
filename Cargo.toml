[package]
name = "text_killer"
version = "1.3.1"
authors = ["kaiju_killer"]
edition = "2021"
description = "A terminal text editor with an IRC-inspired interface"
license = "MIT"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
