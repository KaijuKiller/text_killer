name: Bug report
description: Something in text_killer doesn't work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much as you can.
        **Security problems:** please don't report them here. Use the
        *Security* tab › *Report a vulnerability* instead, so the details stay private.

  - type: input
    id: version
    attributes:
      label: text_killer version
      description: Run `text_killer --version` (or see the status bar / Help screen).
      placeholder: "text_killer 1.3.2"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (ARM64, e.g. Raspberry Pi)
        - Other
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer (setup.exe)
        - Windows portable zip
        - macOS installer (install.command or .pkg)
        - macOS portable zip
        - Debian/Ubuntu .deb
        - Fedora/openSUSE .rpm
        - Arch .pkg.tar.zst or PKGBUILD
        - Linux tarball / install.sh
        - Built from source
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Which terminal program, and roughly its window size if relevant.
      placeholder: "e.g. Windows Terminal, iTerm2, kitty, GNOME Terminal, inside tmux; about 200x50"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include any error message exactly as shown.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open a .docx file with `text_killer report.docx`
        2. Press F2 › View › Page view › 2 pages
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: input
    id: file-type
    attributes:
      label: File type involved (if any)
      description: For example .py, .html, .odt, .docx, .epub. If you can, attach a small sample file that shows the problem (remove anything private first).

  - type: dropdown
    id: page-view
    attributes:
      label: Page view setting (Options › View › Page view)
      options:
        - Auto (default)
        - A fixed number of pages
        - Off (continuous view)
        - Not sure

  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Screenshots help a lot with display problems. You can paste images directly here.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
